
<html>
<head>

<body data-demo-page="forgot-password" data-demo-role="public">
    <section class="side">
        <img class="adminportal-left-section-image" src="resources/images/icon1.png" alt="logo">
        <h2 class="adminportal-left-section-title"></h2>
    </section>

    <section class="main">
        <div class="login-container">
            <form action="#" data-demo-action="">
                <a class="go-back" style ="margin-top: -50px;" href="#/patient" data-demo-route="patient">< Go Back</a>
                <img class="adminportal-left-section-image-second" src="resources/images/icon1.png" alt="logo"><br>

                <h2 class="adminportal-right-section-title">Forgot Password</h2>
                <p class="adminportal-right-section-subtitle">Enter the email you used with BPBMC and we'll send you a link to reset your password</p>

                
                    <p class="error-message" style="color: red; text-align: center; border: 1px solid red; border-radius: 6px; padding: 0.5rem; background-color: #ff000020;" >
                __DEMO_reset_message__
                    </p>
                
                
                    <p style="color: green; text-align: center; border: 1px solid green; border-radius: 6px; padding: 0.5rem; background-color: #8db6003b;" >
                __DEMO_reset_success__
                    </p>
                <br>

                <label for="user_email">Enter your email:</label>
                <input type="text" name="user_email" id="user_email" required><br>
                <button type="submit" name="reset_password">Reset Password</button>
        </form>
        </div>

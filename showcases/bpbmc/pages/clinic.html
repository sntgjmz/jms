
<!DOCTYPE html>
<html lang="en">
<head>
<base href="../">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="resources/vendor/fonts/fonts.css">
    <title>Clinic Portal</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="resources/vendor/bootstrap/bootstrap.min.css">
    <link rel="icon" type="png/jpeg" href="resources/images/icon1.png">
    <link rel="stylesheet" href="resources/css/clinic.css">
<link rel="stylesheet" href="demo/demo.css">
</head>
<body data-demo-page="clinic" data-demo-role="public">



<section class="side">
    <img class="adminportal-left-section-image" src="resources/images/icon1.png" alt="logo">
    <h2 class="adminportal-left-section-title">Clinic Portal</h2>
</section>

<section class="main">
    <div class="login-container">
        <img class="adminportal-left-section-image-second" src="resources/images/icon1.png" alt="logo">
        <h2 class="adminportal-right-section-title">Welcome</h2>
        <h2 class="adminportal-right-section-title-portal">Clinic Portal</h2>
        <p class="adminportal-right-section-subtitle">Sign in to continue</p>
        <form class="login-form" autocomplete="off" action="#" data-demo-action="">
            
                <p class="error-message" style="color: red; text-align: center; border: 1px solid red; border-radius: 6px; padding: 0.5rem; background-color: #ff000020;">
                    __DEMO_login_error__
                </p>
            
            <div class="adminportal-form-control">
                <label class="form-label" for="user_id">User ID</label>
                <input class="adminportal-form " type="text" id="user_id" name="user_id" placeholder="Enter your User ID" maxlength="4" required>
            </div>

            <div class="adminportal-form-control">
                <label class="form-label" for="login-password">Password</label>
                <input class="adminportal-form" type="password" id="login-password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="adminportal-form-control">
                <button type="submit" class="adminportal-login-button">Sign-in</button>
            </div>
        </form>
    </div>
</section>


<script src="resources/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="resources/library/swiper/swiper-bundle.min.js"></script>
<script type="module" src="demo/runtime.js"></script>
</body>
</html>
